name: Sincronizar releases

# Três gatilhos de propósito diferente:
#  - repository_dispatch: o repositório da app avisa que publicou (segundos)
#  - schedule: rede de segurança, apanha qualquer dispatch perdido
#  - workflow_dispatch: forçar à mão quando se mexe na configuração
on:
  repository_dispatch:
    types: [release-published]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/data/apps.json'
      - 'scripts/sync-releases.mjs'
      - '.github/workflows/sync-releases.yml'

permissions:
  contents: write

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar versions.json e manifest.plist
        run: node scripts/sync-releases.mjs
        env:
          # O GITHUB_TOKEN do próprio repositório chega para ler releases
          # públicos e sobe o limite de 60 para 5000 pedidos/hora.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit se houver alterações
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ota
          if git diff --staged --quiet; then
            echo "Sem alterações."
          else
            git commit -m "chore: sincronizar versões dos releases"
            git push
          fi
